server:
  port: 8080
spring:
  application:
    name: "HelpDesk"
  devtools:
    add-properties: false
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
  datasource:
    url: "jdbc:postgresql://localhost:5432/ticket-db"
    username: "admin"
    password: "admin"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
  flyway:
    enabled: true
    locations: "classpath:db/migration"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
scheduler:
  tasks:
    league-season-expiration:
      cron: "0 0 0 1 * *"
      enabled: true
      timezone: "America/Bogota"

