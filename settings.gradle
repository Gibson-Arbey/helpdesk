pluginManagement {
    repositories {
        //mavenLocal()
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'HelpDesk'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':jpa-repository'
project(':jpa-repository').projectDir = file('./infrastructure/driven-adapters/jpa-repository')
include ':api-rest'
project(':api-rest').projectDir = file('./infrastructure/entry-points/api-rest')
include ':rabbitmq-publisher'
project(':rabbitmq-publisher').projectDir = file('./infrastructure/driven-adapters/rabbitmq-publisher')
include ':rabbitmq-listener'
project(':rabbitmq-listener').projectDir = file('./infrastructure/entry-points/rabbitmq-listener')
include ':security'
project(':security').projectDir = file('./infrastructure/driven-adapters/security')
include ':scheduler'
project(':scheduler').projectDir = file('./infrastructure/entry-points/scheduler')